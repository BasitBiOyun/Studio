name: Materialize UEFA Logo Report Mode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-logo-report-only.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch verifier and workflow
        run: node scripts/materialize-logo-report-only.cjs

      - name: Commit report-only mode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-uefa-top-divisions.cjs .github/workflows/sync-club-catalogue.yml
          if git diff --cached --quiet; then
            echo "Report-only mode is already materialized."
            exit 0
          fi
          git commit -m "Make UEFA logo coverage non-blocking"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            git rebase --abort || true
            sleep 3
          done
          exit 1
