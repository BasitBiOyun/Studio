name: Fix editor sidebar runtime

on:
  push:
    paths:
      - '.github/workflows/fix-editor-sidebar-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch broken crop integration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/components/EditorSidebar.tsx';
          let code = fs.readFileSync(file, 'utf8');

          if (!code.includes("import { ImageCropModal } from './ImageCropModal';")) {
            code = code.replace(
              "import { ClubLogoSelector } from './ClubLogoSelector';",
              "import { ClubLogoSelector } from './ClubLogoSelector';\nimport { ImageCropModal } from './ImageCropModal';\nimport imageCompression from 'browser-image-compression';"
            );
          }

          if (!code.includes('const [cropState, setCropState]')) {
            code = code.replace(
              "const [activeTab, setActiveTab] = useState<MainTab>('data');",
              "const [activeTab, setActiveTab] = useState<MainTab>('data');\n  const [cropState, setCropState] = useState<{ src: string; type: 'primary' | 'secondary' | number } | null>(null);"
            );
          }

          code = code.replace(
            'const v = new Vibrant(img);',
            "const { Vibrant } = await import('node-vibrant/browser');\n        const v = new Vibrant(img);"
          );

          fs.writeFileSync(file, code);
          fs.unlinkSync('.github/workflows/fix-editor-sidebar-runtime.yml');
          NODE

      - name: Install and build
        run: npm ci && npm run build

      - name: Commit fix directly to main
        run: |
          git config user.name "Studio Repair Bot"
          git config user.email "studio-repair@users.noreply.github.com"
          git add src/components/EditorSidebar.tsx .github/workflows/fix-editor-sidebar-runtime.yml
          git commit -m "Fix crop state runtime integration"
          git push origin HEAD:main
